<!DOCTYPE html>
<html lang="cn_zh">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ajax</title>
  <script src="../dist/myQuery.js"></script>
</head>

<body>
  <div id="app"></div>
  <script>
    /**
     * @description: ajax
     * @param {*} options
     * @return {*}
     */
    $.ajax({
      url: "/package.json",
      method: "POST",
      data: {
        title: "foo",
        body: "bar",
        userId: 1,
      },
    }).then((res) => {
      const packageJson = JSON.parse(res)
      $("#app").html(`<h1>${packageJson.name}</h1>`)
    });

  </script>

</body>

</html>
